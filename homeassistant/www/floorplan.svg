  <line class="window" x1="70" y1="720" x2="360" y2="720"/><line class="window" x1="465" y1="720" x2="785" y2="720"/>
  <line class="window" x1="1158" y1="445" x2="1158" y2="675"/>
  <rect class="furniture" x="370" y="180" width="210" height="92" rx="20"/><rect class="furniture" x="620" y="125" width="130" height="95" rx="8"/>
  <rect class="furniture" x="85" y="590" width="255" height="85" rx="8"/><rect class="furniture" x="485" y="590" width="285" height="85" rx="8"/>
