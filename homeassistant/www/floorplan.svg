<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Home Assistant Agent 120 平米三室一厅平面图</title>
  <desc id="desc">包含玄关、客厅、主卧、次卧、书房、厨房、卫生间和阳台的智能家居平面图。</desc>
  <style>
    .wall { fill: #f6f8fb; stroke: #263238; stroke-width: 12; stroke-linejoin: round; }
    .room { stroke: #c8d0d8; stroke-width: 3; }
    .living { fill: #e7f2ff; } .bed { fill: #f5ecff; } .work { fill: #e9f8f0; }
    .service { fill: #fff4e5; } .entry { fill: #edf0f5; } .balcony { fill: #e5f7f8; }
    .label { font: 500 28px sans-serif; fill: #263238; text-anchor: middle; }
    .sub { font: 18px sans-serif; fill: #607080; text-anchor: middle; }
    .furniture { fill: #c5d2df; stroke: #91a4b6; stroke-width: 2; }
    .window { stroke: #5da9e9; stroke-width: 9; }
    .door { stroke: #91a4b6; stroke-width: 5; fill: none; }
  </style>
  <rect class="wall" x="35" y="35" width="1130" height="690" rx="8"/>
  <rect class="room entry" x="45" y="45" width="185" height="210"/>
